plugins {
    id 'java'
    id "com.gradleup.shadow" version "9.4.1"
}

repositories {
    mavenCentral()
    // Paper
    maven { url 'https://repo.papermc.io/repository/maven-public/' }
    // PlaceholderAPI
    maven { url 'https://repo.helpch.at/releases/' }
    // CoreProtect
    maven { url "https://maven.playpro.com/" }
    // FastAsyncWorldEdit, WorldGuard
    maven { url "https://maven.enginehub.org/repo/" }
    // Geyser
    maven { url "https://repo.opencollab.dev/main/" }
}

dependencies {
    implementation project(':common')

    // Updated Paper versioning (Year.Drop.Patch format)
    compileOnly 'io.papermc.paper:paper-api:26.1.2.build.+'

    compileOnly 'com.sk89q.worldguard:worldguard-bukkit:7.0.7' // Ref: https://maven.enginehub.org/repo/com/sk89q/worldguard/worldguard-bukkit/
    implementation(platform("com.intellectualsites.bom:bom-newest:1.56")) // Ref: https://github.com/IntellectualSites/bom
    compileOnly("com.fastasyncworldedit:FastAsyncWorldEdit-Core")
    compileOnly("com.fastasyncworldedit:FastAsyncWorldEdit-Bukkit")
    compileOnly 'me.clip:placeholderapi:2.11.7' // Ref: https://github.com/PlaceholderAPI/PlaceholderAPI/releases
    compileOnly "net.coreprotect:coreprotect:22.4" // Note: Newer versions of the plugin are reportedly problematic. Seek alternative at some point
    compileOnly 'org.mariadb.jdbc:mariadb-java-client:3.5.7' // Ref: https://mvnrepository.com/artifact/org.mariadb.jdbc/mariadb-java-client
    implementation "dev.dejvokep:boosted-yaml-spigot:1.5" // Ref: https://github.com/dejvokep/boosted-yaml-spigot/releases
    implementation "dev.dejvokep:boosted-yaml:1.3.7" // Ref: https://github.com/dejvokep/boosted-yaml/releases
    compileOnly 'org.geysermc.floodgate:api:2.2.5-SNAPSHOT' // Ref: https://repo.opencollab.dev/javadoc/maven-snapshots/org/geysermc/floodgate/api/latest
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
}

processResources {
    filesMatching('**/*.yml') {
        expand project.properties
    }
}

tasks.register('processSources', Sync) {
    from sourceSets.main.java
    into "$buildDir/generated-src"
    filter { line -> line.replace('${version}', version.toString()) }
}

tasks.named('compileJava') {
    source = processSources.outputs
}

shadowJar {
    archiveFileName = "VexelCore-Bukkit-${project.version}.jar"
    duplicatesStrategy = DuplicatesStrategy.FAIL
    // Relocate lib code
    relocate("dev.dejvokep.boostedyaml", "libs.dev.dejvokep.boostedyaml")
    relocate("dev.dejvokep.boosted-yaml-spigot", "libs.dev.dejvokep.boosted-yaml-spigot")
    exclude '**/LICENSE' // Temp -- Handle better before proper release
}

artifacts {
    archives shadowJar
}

tasks.named('jar') {
    enabled = false
    dependsOn(shadowJar)
}